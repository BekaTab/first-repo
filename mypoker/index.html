/*  კალათის მდგომარეობა (მზადაა მომავალი ონლაინ გადახდისთვის)          */

function cartReducer(state, action) {
  switch (action.type) {
    case "add":
      return { ...state, [action.id]: Math.min((state[action.id] || 0) + 1, 99) };
    case "decrement": {
      const qty = (state[action.id] || 0) - 1;
      const next = { ...state };
      if (qty <= 0) delete next[action.id];
      else next[action.id] = qty;
      return next;
    }
    case "remove": {
      const next = { ...state };
      delete next[action.id];
      return next;
    }
    case "clear":
      return {};
    default:
      return state;
  }
}

function loadCart() {
  try {
    const raw = window.localStorage.getItem(CONFIG.storageKey);
    const parsed = raw ? JSON.parse(raw) : {};
    return Object.fromEntries(
      Object.entries(parsed).filter(
        ([id, qty]) => PRODUCTS.some((p) => p.id === id) && Number.isInteger(qty) && qty > 0
      )
    );
  } catch {
    return {};
  }
}

function useCart() {
  const [items, dispatch] = useReducer(cartReducer, undefined, loadCart);

  useEffect(() => {
    try {
      window.localStorage.setItem(CONFIG.storageKey, JSON.stringify(items));
    } catch {
      /* საცავი მიუწვდომელია — კალათა მუშაობს მეხსიერებაში */
    }
  }, [items]);

  const lines = useMemo(
    () =>
      Object.entries(items)
        .map(([id, qty]) => ({ product: PRODUCTS.find((p) => p.id === id), qty }))
        .filter((l) => l.product),
    [items]
  );
  const count = lines.reduce((sum, l) => sum + l.qty, 0);
  const total = lines.reduce((sum, l) => sum + l.qty * l.product.price, 0);

  return {
    lines,
    count,
    total,
    add: (id) => dispatch({ type: "add", id }),
    decrement: (id) => dispatch({ type: "decrement", id }),
    remove: (id) => dispatch({ type: "remove", id }),
    clear: () => dispatch({ type: "clear" }),
  };
}

function useProductFilter(products) {
  const [category, setCategory] = useState("all");
  const [query, setQuery] = useState("");
  const [sort, setSort] = useState("featured");

  const counts = useMemo(() => {
    const c = { all: products.length };
    products.forEach((p) => (c[p.category] = (c[p.category] || 0) + 1));
    return c;
  }, [products]);

  const visible = useMemo(() => {
    const q = query.trim().toLowerCase();
    const list = products.filter(
      (p) =>
        (category === "all" || p.category === category) &&
        (!q || `${p.name} ${p.spec} ${p.description}`.toLowerCase().includes(q))
    );
    const sorted = [...list];
    if (sort === "price-asc") sorted.sort((a, b) => a.price - b.price);
    if (sort === "price-desc") sorted.sort((a, b) => b.price - a.price);
    if (sort === "rating") sorted.sort((a, b) => b.rating - a.rating || b.reviews - a.reviews);
    return sorted;
  }, [products, category, query, sort]);

  return { category, setCategory, query, setQuery, sort, setSort, counts, visible };
}

function ChipStack({ x, baseY, count, color, uid }) {
  return (
    <g>
      <ellipse cx={x} cy={baseY + 6} rx="30" ry="8" fill="#0f172a" opacity="0.12" />
      {Array.from({ length: count }).map((_, i) => {
        const cy = baseY - i * 7;
        return (
          <g key={i}>
            <ellipse cx={x} cy={cy + 2.5} rx="26" ry="9" fill={color} />
            <ellipse cx={x} cy={cy + 2.5} rx="26" ry="9" fill="#000" opacity="0.18" />
            <ellipse cx={x} cy={cy} rx="26" ry="9" fill={color} />
            <ellipse cx={x} cy={cy} rx="26" ry="9" fill="none" stroke="#fff" strokeOpacity="0.9" strokeWidth="2.4" strokeDasharray="7 9" />
            {i === count - 1 && (
              <>
                <ellipse cx={x} cy={cy} rx="16" ry="5.4" fill={`url(#${uid}-shine)`} />
                <ellipse cx={x} cy={cy} rx="16" ry="5.4" fill="none" stroke="#fff" strokeOpacity="0.6" />
              </>
            )}
          </g>
        );
      })}
    </g>
  );
}

          <text x="20" y="36" fontSize="14" textAnchor="middle" fill={ink} transform="rotate(180 20 31)">{suit}</text>

          <rect x="-25" y="-39" width="50" height="78" rx="4" fill={`url(#${uid}-diamond)`} stroke="#fff" strokeOpacity="0.7" />

}

            value={sort}
            onChange={(e) => setSort(e.target.value)}
            className="h-10 w-full appearance-none rounded-full border border-gray-200 bg-white pl-4 pr-10 text-sm font-medium text-gray-800 transition-colors focus:border-red-400 focus:outline-none sm:w-56"
          >
            {SORTS.map((s) => (
              <option key={s.id} value={s.id}>
                {s.label}
              </option>
            ))}
          </select>
          <ChevronDown className="pointer-events-none absolute right-4 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" />
        </label>
      </div>

      <div className="mp-scroll -mx-4 mt-5 flex gap-2 overflow-x-auto px-4 pb-1 sm:mx-0 sm:flex-wrap sm:px-0" role="tablist" aria-label="ფილტრი კატეგორიით">
        {CATEGORIES.map((cat) => {
          const active = category === cat.id;
          return (
            <button
              key={cat.id}
              type="button"
              role="tab"
              aria-selected={active}
              onClick={() => setCategory(cat.id)}
              className={`inline-flex shrink-0 items-center gap-2 rounded-full border px-4 py-2 text-sm font-medium transition-all duration-200 ${
                active
                  ? "border-gray-900 bg-gray-900 text-white"
                  : "border-gray-200 bg-white text-gray-700 hover:border-gray-400"
              }`}
            >
              {cat.label}
              <span className={`mp-num text-xs ${active ? "text-gray-300" : "text-gray-400"}`}>{counts[cat.id] || 0}</span>
            </button>
          );
        })}
      </div>

      {visible.length > 0 ? (
        <div key={gridKey} className="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-5 lg:grid-cols-3 xl:grid-cols-4">
          {visible.map((product, i) => (
            <ProductCard key={product.id} product={product} index={i} inCart={inCart.has(product.id)} onAdd={cart.add} />
          ))}
        </div>
      ) : (
        <div className="mp-fade mt-6 flex flex-col items-center rounded-2xl border border-dashed border-gray-300 bg-gray-50 px-6 py-16 text-center">
          <Search className="h-8 w-8 text-gray-400" />
          <p className="mt-4 text-base font-semibold text-gray-900">პროდუქტი ვერ მოიძებნა</p>
          <p className="mt-1 text-sm text-gray-500">სცადეთ სხვა სიტყვა ან აირჩიეთ კატეგორია „ყველა“.</p>
          <button
            type="button"
            onClick={() => {
              setQuery("");
              setCategory("all");
            }}
            className="mt-5 rounded-full bg-gray-900 px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-gray-700"
          >
            ფილტრების გასუფთავება
          </button>
        </div>
      )}
    </section>
  );
}

/* ------------------------------------------------------------------ */
/*  შეკვეთის ინსტრუქცია                                               */
/* ------------------------------------------------------------------ */
function HowToOrder() {
  const steps = [
    { title: "აირჩიეთ პროდუქტი", text: "იპოვეთ სასურველი ნივთი კატალოგში ან ძიებით." },
    { title: "მოგვწერეთ WhatsApp-ში", text: "დააჭირეთ „შესაკვეთად დაგვიკავშირდით“ — შეტყობინება თავად შეივსება." },
    { title: "მიიღეთ შეკვეთა", text: "დავადასტურებთ დეტალებს და გამოგიგზავნით მისამართზე." },
  ];
  return (
    <section className="bg-gray-50">
      <div className="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
        <h2 className="text-xl font-bold text-gray-900 sm:text-2xl">როგორ შევუკვეთო?</h2>
        <ol className="mt-6 grid gap-4 md:grid-cols-3">
          {steps.map((s, i) => (
            <li key={s.title} className="flex gap-4 rounded-2xl bg-white p-5 ring-1 ring-gray-200">
              <span className="mp-num grid h-9 w-9 shrink-0 place-items-center rounded-full bg-red-600 text-sm font-bold text-white">{i + 1}</span>
              <span className="min-w-0">
                <span className="block font-semibold text-gray-900">{s.title}</span>
                <span className="mt-1 block text-sm leading-relaxed text-gray-500">{s.text}</span>
              </span>
            </li>
          ))}
        </ol>
      </div>
    </section>
  );
}

/* ------------------------------------------------------------------ */
/*  კალათის პანელი                                                     */
/* ------------------------------------------------------------------ */
function CartDrawer({ open, onClose, cart }) {
  useEffect(() => {
    if (!open) return undefined;
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      window.removeEventListener("keydown", onKey);
      document.body.style.overflow = prev;
    };
  }, [open, onClose]);

  if (!open) return null;

  return (
    <div className="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-label="კალათა">
      <button type="button" className="mp-fade absolute inset-0 bg-gray-900/40 backdrop-blur-[2px]" onClick={onClose} aria-label="დახურვა" />
      <aside className="mp-slide-in absolute inset-y-0 right-0 flex w-full max-w-md flex-col bg-white pb-[env(safe-area-inset-bottom,0px)] pt-[env(safe-area-inset-top,0px)] shadow-2xl">
        <div className="flex items-center justify-between border-b border-gray-200 px-5 py-4">
          <div>
            <h2 className="text-lg font-bold text-gray-900">კალათა</h2>
            <p className="mp-num text-xs text-gray-500">{cart.count} ნივთი</p>
          </div>
          <button
            type="button"
            onClick={onClose}
            className="grid h-10 w-10 place-items-center rounded-full text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-900"
            aria-label="კალათის დახურვა"
          >
            <X className="h-5 w-5" />
          </button>
        </div>

        {cart.lines.length === 0 ? (
          <div className="flex flex-1 flex-col items-center justify-center px-8 text-center">
            <span className="grid h-16 w-16 place-items-center rounded-full bg-gray-100">
              <ShoppingCart className="h-7 w-7 text-gray-400" />
            </span>
            <p className="mt-4 font-semibold text-gray-900">კალათა ცარიელია</p>
            <p className="mt-1 text-sm text-gray-500">დაამატეთ პროდუქტები და გამოგვიგზავნეთ ერთი შეტყობინებით.</p>
            <button
              type="button"
              onClick={onClose}
              className="mt-6 rounded-full bg-gray-900 px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-gray-700"
            >
              შოპინგის გაგრძელება
            </button>
          </div>
        ) : (
          <>
            <ul className="flex-1 divide-y divide-gray-100 overflow-y-auto px-5">
              {cart.lines.map(({ product, qty }) => (
                <li key={product.id} className="mp-fade flex gap-4 py-4">
                  <div className="h-20 w-24 shrink-0 overflow-hidden rounded-xl bg-gray-50 p-2">
                    <ProductVisual visual={product.visual} uid={`c-${product.id}`} label={product.name} />
                  </div>
                  <div className="flex min-w-0 flex-1 flex-col">
                    <p className="text-sm font-medium leading-snug text-gray-900">{product.name}</p>
                    <p className="mp-num mt-0.5 text-xs text-gray-500">{formatPrice(product.price)} / ცალი</p>
                    <div className="mt-auto flex items-center justify-between pt-2">
                      <div className="flex items-center rounded-full border border-gray-200">
                        <button
                          type="button"
                          onClick={() => cart.decrement(product.id)}
                          className="grid h-8 w-8 place-items-center text-gray-500 hover:text-gray-900"
                          aria-label="რაოდენობის შემცირება"
                        >
                          <Minus className="h-3.5 w-3.5" />
                        </button>
                        <span className="mp-num w-6 text-center text-sm font-semibold text-gray-900">{qty}</span>
                        <button
                          type="button"
                          onClick={() => cart.add(product.id)}
                          className="grid h-8 w-8 place-items-center text-gray-500 hover:text-gray-900"
                          aria-label="რაოდენობის გაზრდა"
                        >
                          <Plus className="h-3.5 w-3.5" />
                        </button>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="mp-num text-sm font-bold text-gray-900">{formatPrice(product.price * qty)}</span>
                        <button
                          type="button"
                          onClick={() => cart.remove(product.id)}
                          className="text-gray-400 transition-colors hover:text-red-600"
                          aria-label={`წაშლა: ${product.name}`}
                        >
                          <Trash2 className="h-4 w-4" />
                        </button>
                      </div>
                    </div>
                  </div>
                </li>
              ))}
            </ul>

            <div className="border-t border-gray-200 bg-gray-50 px-5 py-5">
              <div className="flex items-baseline justify-between">
                <span className="text-sm text-gray-600">ჯამი</span>
                <span className="mp-num text-2xl font-extrabold text-gray-900">{formatPrice(cart.total)}</span>
              </div>
              <p className="mt-2 text-xs leading-relaxed text-gray-500">
                ონლაინ გადახდა მალე დაემატება. ამ ეტაპზე შეკვეთას ვადასტურებთ WhatsApp-ით ან ტელეფონით.
              </p>
              <a
                href={cartWhatsAppLink(cart.lines, cart.total)}
                target="_blank"
                rel="noopener noreferrer"
                className="mt-4 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-green-600 px-5 py-3.5 text-sm font-bold text-white transition-colors hover:bg-green-700"
              >
                <MessageCircle className="h-4 w-4" />
                შესაკვეთად დაგვიკავშირდით
              </a>
              <button
                type="button"
                disabled
                className="mt-2 w-full cursor-not-allowed rounded-xl border border-gray-200 bg-white px-5 py-3 text-sm font-medium text-gray-400"
                title="ონლაინ გადახდა დროებით გათიშულია"
              >
                ონლაინ გადახდა — მალე
              </button>
              <button type="button" onClick={cart.clear} className="mt-3 w-full text-xs text-gray-500 transition-colors hover:text-red-600">
                კალათის გასუფთავება
              </button>
            </div>
          </>
        )}
      </aside>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  ფუტერი                                                             */
/* ------------------------------------------------------------------ */
function Footer({ onCategory }) {
  return (
    <footer className="border-t border-gray-200 bg-white">
      <div className="mx-auto grid max-w-7xl gap-8 px-4 py-12 sm:grid-cols-2 sm:px-6 lg:grid-cols-4 lg:px-8">
        <div className="lg:col-span-2">
          <Logo />
          <p className="mt-4 max-w-sm text-sm leading-relaxed text-gray-500">
            პოკერის აქსესუარების ონლაინ მაღაზია: ჩიპები, კარტები, მაგიდები და აქსესუარები სახლის თამაშებისთვის და კლუბებისთვის.
          </p>
        </div>
        <div>
          <p className="text-sm font-bold text-gray-900">კატეგორიები</p>
          <ul className="mt-3 space-y-2 text-sm text-gray-500">
            {CATEGORIES.filter((c) => c.id !== "all").map((c) => (
              <li key={c.id}>
                <a href="#shop" onClick={() => onCategory(c.id)} className="transition-colors hover:text-red-600">
                  {c.label}
                </a>
              </li>
            ))}
          </ul>
        </div>
        <div>
          <p className="text-sm font-bold text-gray-900">კონტაქტი</p>
          <a href={`tel:${CONFIG.phoneTel}`} className="mp-num mt-3 block select-all text-lg font-bold text-gray-900 transition-colors hover:text-green-700">
            {CONFIG.phoneDisplay}
          </a>
          <p className="mt-1 text-sm text-gray-500">ყოველდღე, 10:00 – 22:00</p>
          <a
            href={buildWhatsAppLink("გამარჯობა, mypoker.ge-დან გწერთ.")}
            target="_blank"
            rel="noopener noreferrer"
            className="mt-4 inline-flex items-center gap-2 rounded-full bg-green-50 px-4 py-2 text-sm font-semibold text-green-700 transition-colors hover:bg-green-100"
          >
            <MessageCircle className="h-4 w-4" />
            მოგვწერეთ WhatsApp-ში
          </a>
        </div>
      </div>
      <div className="border-t border-gray-100">
        <p className="mx-auto max-w-7xl px-4 py-5 text-xs text-gray-400 sm:px-6 lg:px-8">
          © {new Date().getFullYear()} mypoker.ge — ყველა უფლება დაცულია. აზარტული თამაში მხოლოდ 18 წლიდან.
        </p>
      </div>
    </footer>
  );
}

/* ------------------------------------------------------------------ */
/*  აპლიკაცია                                                          */
/* ------------------------------------------------------------------ */
function App() {
  const cart = useCart();
  const filter = useProductFilter(PRODUCTS);
  const [cartOpen, setCartOpen] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (!toast) return undefined;
    const t = setTimeout(() => setToast(null), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  const cartApi = {
    ...cart,
    add: (id) => {
      cart.add(id);
      const product = PRODUCTS.find((p) => p.id === id);
      if (product && !cartOpen) setToast({ id: Date.now(), name: product.name });
    },
  };

  const openCart = () => {
    setToast(null);
    setCartOpen(true);
  };

  return (
    <div id="top" className="mp-sans min-h-screen bg-white text-gray-900 antialiased selection:bg-red-100">
      <style>{GLOBAL_CSS}</style>

      <div className="bg-gray-900 px-4 py-2 text-center text-xs font-medium text-white">
        შეკვეთა WhatsApp-ით ან ტელეფონით · <span className="mp-num">{CONFIG.phoneDisplay}</span>
      </div>

      <Header
        cartCount={cart.count}
        onOpenCart={openCart}
        query={filter.query}
        onQuery={filter.setQuery}
        category={filter.category}
        onCategory={filter.setCategory}
      />
      <main>
        <Hero onCategory={filter.setCategory} />
        <CategoryTiles counts={filter.counts} onCategory={filter.setCategory} />
        <Shop filter={filter} cart={cartApi} />
        <HowToOrder />
      </main>
      <Footer onCategory={filter.setCategory} />
      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} cart={cartApi} />

      {toast && (
        <div
          key={toast.id}
          className="mp-toast fixed bottom-[calc(1.25rem+env(safe-area-inset-bottom,0px))] left-1/2 z-50 flex w-[calc(100%-2rem)] max-w-md items-center gap-3 rounded-2xl bg-gray-900 px-4 py-3 text-white shadow-2xl"
          role="status"
        >
          <span className="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-green-500">
            <Check className="h-4 w-4" />
          </span>
          <p className="min-w-0 flex-1 truncate text-sm">
            კალათაში დაემატა: <span className="font-semibold">{toast.name}</span>
          </p>
          <button type="button" onClick={openCart} className="shrink-0 text-sm font-bold text-green-400 hover:text-green-300">
            ნახვა
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
