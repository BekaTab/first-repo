function cartReducer(state, action) {
  switch (action.type) {
    case "add": {
      const qty = (state[action.id] || 0) + 1;
      return { ...state, [action.id]: Math.min(qty, 99) };
    }
    case "decrement": {
      const qty = (state[action.id] || 0) - 1;
      const next = { ...state };
      if (qty <= 0) delete next[action.id];
      else next[action.id] = qty;
      return next;
    }
    case "remove": {
      const next = { ...state };
      delete next[action.id];
      return next;
    }
    case "clear":
      return {};
    default:
      return state;
  }
}

function loadCart() {
  try {
    const raw = window.localStorage.getItem(CONFIG.storageKey);
    const parsed = raw ? JSON.parse(raw) : {};
    return Object.fromEntries(
      Object.entries(parsed).filter(
        ([id, qty]) => PRODUCTS.some((p) => p.id === id) && Number.isInteger(qty) && qty > 0
      )
    );
  } catch {
    return {};
  }
}

function useCart() {
  const [items, dispatch] = useReducer(cartReducer, undefined, loadCart);

  useEffect(() => {
    try {
      window.localStorage.setItem(CONFIG.storageKey, JSON.stringify(items));
    } catch {
      /* საცავი მიუწვდომელია — კალათა მუშაობს მეხსიერებაში */
    }
  }, [items]);

  const lines = useMemo(
    () =>
      Object.entries(items)
        .map(([id, qty]) => ({ product: PRODUCTS.find((p) => p.id === id), qty }))
        .filter((l) => l.product),
    [items]
  );
  const count = lines.reduce((sum, l) => sum + l.qty, 0);
  const total = lines.reduce((sum, l) => sum + l.qty * l.product.price, 0);

  return {
    lines,
    count,
    total,
    add: (id) => dispatch({ type: "add", id }),
    decrement: (id) => dispatch({ type: "decrement", id }),
    remove: (id) => dispatch({ type: "remove", id }),
    clear: () => dispatch({ type: "clear" }),
  };
}

function useProductFilter(products) {
  const [category, setCategory] = useState("all");
  const [query, setQuery] = useState("");
  const [sort, setSort] = useState("featured");

  const counts = useMemo(() => {
    const c = { all: products.length };
    products.forEach((p) => (c[p.category] = (c[p.category] || 0) + 1));
    return c;
  }, [products]);

  const visible = useMemo(() => {
    const q = query.trim().toLowerCase();
    const list = products.filter(
      (p) =>
        (category === "all" || p.category === category) &&
        (!q || `${p.name} ${p.spec} ${p.description}`.toLowerCase().includes(q))
    );
    const sorted = [...list];
    if (sort === "price-asc") sorted.sort((a, b) => a.price - b.price);
    if (sort === "price-desc") sorted.sort((a, b) => b.price - a.price);
    if (sort === "rating") sorted.sort((a, b) => b.rating - a.rating || b.reviews - a.reviews);
    return sorted;
  }, [products, category, query, sort]);

  return { category, setCategory, query, setQuery, sort, setSort, counts, visible };
}

function ChipStack({ x, baseY, count, color, uid }) {
  return (
    <g>
      {Array.from({ length: count }).map((_, i) => {
        const cy = baseY - i * 7;
        return (
          <g key={i}>
            <ellipse cx={x} cy={cy + 3} rx="26" ry="9" fill="#000" opacity="0.35" />
            <ellipse cx={x} cy={cy} rx="26" ry="9" fill={color} />
            <ellipse
              cx={x}
              cy={cy}
              rx="26"
              ry="9"
              fill="none"
              stroke="#fff"
              strokeOpacity="0.85"
              strokeWidth="2.4"
              strokeDasharray="7 9"
            />
            {i === count - 1 && (
              <>
                <ellipse cx={x} cy={cy} rx="16" ry="5.4" fill={`url(#${uid}-shine)`} />
                <ellipse cx={x} cy={cy} rx="16" ry="5.4" fill="none" stroke="#fff" strokeOpacity="0.5" />
              </>
            )}
          </g>
        );
      })}
    </g>
  );
}

function PlayingCard({ x, y, rotate, back, ink, suit, uid }) {
  return (
    <g transform={`translate(${x} ${y}) rotate(${rotate})`}>
      <rect x="-30" y="-44" width="60" height="88" rx="7" fill="#000" opacity="0.35" transform="translate(3 4)" />
      {suit ? (
        <>
          <rect x="-30" y="-44" width="60" height="88" rx="7" fill="#fafaf9" />
          <text x="-20" y="-26" fontSize="14" textAnchor="middle" fill={ink}>{suit}</text>
          <text x="0" y="12" fontSize="34" textAnchor="middle" fill={ink}>{suit}</text>
          <text x="20" y="36" fontSize="14" textAnchor="middle" fill={ink} transform="rotate(180 20 31)">{suit}</text>
        </>
      ) : (
        <>
          <rect x="-30" y="-44" width="60" height="88" rx="7" fill={back} />
          <rect x="-25" y="-39" width="50" height="78" rx="4" fill={`url(#${uid}-diamond)`} stroke="#fff" strokeOpacity="0.6" />
        </>
      )}
    </g>
  );
}

        <div className="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <p className="text-xs font-semibold uppercase tracking-[0.22em] text-amber-300/80">კოლექცია</p>
            <h2 className="mp-serif mp-balance mt-3 text-3xl font-semibold text-stone-50 sm:text-4xl">აირჩიეთ თქვენი მაგიდის ხასიათი</h2>
            <p className="mt-3 max-w-xl text-sm leading-relaxed text-stone-400">
              შეკვეთა მარტივია: დააჭირეთ ღილაკს და ჩვენი კონსულტანტი WhatsApp-ში წუთებში გიპასუხებთ.
            </p>
          </div>

          <div className="flex w-full flex-col gap-3 sm:flex-row lg:w-auto">
            <label className="relative flex-1 lg:w-72" htmlFor="mp-search">
              <span className="sr-only">ძიება</span>
              <Search className="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-500" />
              <input
                id="mp-search"
                type="search"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="მოძებნეთ პროდუქტი…"
                className="h-11 w-full rounded-full border border-white/10 bg-white/[0.03] pl-11 pr-4 text-sm text-stone-100 placeholder:text-stone-500 transition-colors focus:border-amber-300/50 focus:bg-white/[0.05] focus:outline-none"
              />
            </label>
            <label className="relative" htmlFor="mp-sort">
              <span className="sr-only">დალაგება</span>
              <select
                id="mp-sort"
                value={sort}
                onChange={(e) => setSort(e.target.value)}
                className="h-11 w-full appearance-none rounded-full border border-white/10 bg-[#0d0f13] pl-5 pr-10 text-sm text-stone-200 transition-colors focus:border-amber-300/50 focus:outline-none sm:w-56"
              >
                {SORTS.map((s) => (
                  <option key={s.id} value={s.id}>
                    {s.label}
                  </option>
                ))}
              </select>
              <ChevronDown className="pointer-events-none absolute right-4 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-500" />
            </label>
          </div>
        </div>

        <div className="mt-10">
          <CategoryPills active={category} counts={counts} onChange={setCategory} />
        </div>

        <p className="mp-num mt-6 text-xs text-stone-500" aria-live="polite">
          ნაჩვენებია {visible.length} პროდუქტი
        </p>

        {visible.length > 0 ? (
          <div key={gridKey} className="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            {visible.map((product, i) => (
              <ProductCard key={product.id} product={product} index={i} inCart={inCart.has(product.id)} onAdd={cart.add} />
            ))}
          </div>
        ) : (
          <div className="mp-fade mt-6 flex flex-col items-center rounded-3xl border border-dashed border-white/10 px-6 py-20 text-center">
            <Spade className="h-8 w-8 text-stone-600" />
            <p className="mt-4 text-base font-medium text-stone-200">ამ ძიებით პროდუქტი ვერ მოიძებნა</p>
            <p className="mt-1 text-sm text-stone-500">სცადეთ სხვა სიტყვა ან აირჩიეთ კატეგორია „ყველა“.</p>
            <button
              type="button"
              onClick={() => {
                setQuery("");
                setCategory("all");
              }}
              className="mt-6 rounded-full border border-amber-300/40 px-5 py-2.5 text-sm font-medium text-amber-200 transition-colors hover:bg-amber-300/10"
            >
              ფილტრების გასუფთავება
            </button>
          </div>
        )}
      </div>
    </section>
  );
}

/* ------------------------------------------------------------------ */
/*  კალათის პანელი                                                     */
/* ------------------------------------------------------------------ */
function CartDrawer({ open, onClose, cart }) {
  useEffect(() => {
    if (!open) return undefined;
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      window.removeEventListener("keydown", onKey);
      document.body.style.overflow = prev;
    };
  }, [open, onClose]);

  if (!open) return null;

  return (
    <div className="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-label="კალათა">
      <button type="button" className="mp-fade absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} aria-label="დახურვა" />
      <aside className="mp-slide-in absolute inset-y-0 right-0 flex w-full max-w-md flex-col border-l border-white/10 bg-[#0b0d11] pb-[env(safe-area-inset-bottom,0px)] pt-[env(safe-area-inset-top,0px)]">
        <div className="flex items-center justify-between border-b border-white/[0.07] px-6 py-5">
          <div>
            <h2 className="mp-serif text-xl font-semibold text-stone-50">თქვენი კალათა</h2>
            <p className="mp-num mt-0.5 text-xs text-stone-500">{cart.count} ნივთი</p>
          </div>
          <button
            type="button"
            onClick={onClose}
            className="grid h-10 w-10 place-items-center rounded-full border border-white/10 text-stone-300 transition-colors hover:text-stone-50"
            aria-label="კალათის დახურვა"
          >
            <X className="h-4 w-4" />
          </button>
        </div>

        {cart.lines.length === 0 ? (
          <div className="flex flex-1 flex-col items-center justify-center px-8 text-center">
            <ShoppingBag className="h-10 w-10 text-stone-600" strokeWidth={1.4} />
            <p className="mt-4 font-medium text-stone-200">კალათა ცარიელია</p>
            <p className="mt-1 text-sm text-stone-500">დაამატეთ პროდუქტები და გამოგვიგზავნეთ ერთი შეტყობინებით.</p>
            <button
              type="button"
              onClick={onClose}
              className="mt-6 rounded-full border border-amber-300/40 px-5 py-2.5 text-sm font-medium text-amber-200 transition-colors hover:bg-amber-300/10"
            >
              კოლექციაზე დაბრუნება
            </button>
          </div>
        ) : (
          <>
            <ul className="flex-1 divide-y divide-white/[0.06] overflow-y-auto px-6">
              {cart.lines.map(({ product, qty }) => (
                <li key={product.id} className="mp-fade flex gap-4 py-5">
                  <div className="h-20 w-24 shrink-0 overflow-hidden rounded-2xl bg-[radial-gradient(120%_90%_at_50%_0%,#1c2a24_0%,#0d1210_60%)] p-2">
                    <ProductVisual product={product} />
                  </div>
                  <div className="flex min-w-0 flex-1 flex-col">
                    <p className="text-sm font-medium leading-snug text-stone-100">{product.name}</p>
                    <p className="mp-num mt-1 text-xs text-stone-500">{formatPrice(product.price)} / ცალი</p>
                    <div className="mt-auto flex items-center justify-between pt-3">
                      <div className="flex items-center rounded-full border border-white/10">
                        <button
                          type="button"
                          onClick={() => cart.decrement(product.id)}
                          className="grid h-8 w-8 place-items-center text-stone-400 hover:text-stone-100"
                          aria-label="რაოდენობის შემცირება"
                        >
                          <Minus className="h-3.5 w-3.5" />
                        </button>
                        <span className="mp-num w-6 text-center text-sm text-stone-100">{qty}</span>
                        <button
                          type="button"
                          onClick={() => cart.add(product.id)}
                          className="grid h-8 w-8 place-items-center text-stone-400 hover:text-stone-100"
                          aria-label="რაოდენობის გაზრდა"
                        >
                          <Plus className="h-3.5 w-3.5" />
                        </button>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="mp-num text-sm font-semibold text-stone-50">{formatPrice(product.price * qty)}</span>
                        <button
                          type="button"
                          onClick={() => cart.remove(product.id)}
                          className="text-stone-500 transition-colors hover:text-red-400"
                          aria-label={`წაშლა: ${product.name}`}
                        >
                          <Trash2 className="h-4 w-4" />
                        </button>
                      </div>
                    </div>
                  </div>
                </li>
              ))}
            </ul>

            <div className="border-t border-white/[0.07] px-6 py-6">
              <div className="flex items-baseline justify-between">
                <span className="text-sm text-stone-400">ჯამი</span>
                <span className="mp-num mp-serif text-2xl font-semibold text-stone-50">{formatPrice(cart.total)}</span>
              </div>
              <p className="mt-2 text-xs leading-relaxed text-stone-500">
                ონლაინ გადახდა მალე დაემატება. ამ ეტაპზე შეკვეთას ვადასტურებთ WhatsApp-ით ან ტელეფონით.
              </p>
              <a
                href={cartWhatsAppLink(cart.lines, cart.total)}
                target="_blank"
                rel="noopener noreferrer"
                className="mt-5 inline-flex w-full items-center justify-center gap-2 rounded-full bg-gradient-to-r from-emerald-500 to-emerald-600 px-5 py-3.5 text-sm font-semibold text-[#03140d] transition-all duration-300 hover:from-emerald-400 hover:to-emerald-500"
              >
                <MessageCircle className="h-4 w-4" />
                შესაკვეთად დაგვიკავშირდით
              </a>
              <button
                type="button"
                disabled
                className="mt-3 w-full cursor-not-allowed rounded-full border border-white/10 px-5 py-3 text-sm text-stone-500"
                title="ონლაინ გადახდა დროებით გათიშულია"
              >
                ონლაინ გადახდა — მალე
              </button>
              <button type="button" onClick={cart.clear} className="mt-4 w-full text-xs text-stone-500 transition-colors hover:text-stone-300">
                კალათის გასუფთავება
              </button>
            </div>
          </>
        )}
      </aside>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  ფუტერი                                                             */
/* ------------------------------------------------------------------ */
function Footer() {
  return (
    <footer className="border-t border-white/[0.06] bg-[#06070a]">
      <div className="mx-auto flex max-w-7xl flex-col gap-8 px-4 py-12 sm:px-6 md:flex-row md:items-center md:justify-between lg:px-8">
        <div className="max-w-sm">
          <Logo />
          <p className="mt-4 text-sm leading-relaxed text-stone-500">
            პოკერის პრემიუმ აქსესუარები სახლის თამაშებისთვის, კლუბებისა და ტურნირებისთვის.
          </p>
        </div>
        <div className="flex flex-col gap-2 text-sm md:items-end">
          <span className="text-xs uppercase tracking-[0.18em] text-stone-500">დაგვიკავშირდით</span>
          <a href={`tel:${CONFIG.phoneTel}`} className="mp-num select-all text-lg font-semibold text-stone-100 transition-colors hover:text-emerald-300">
            {CONFIG.phoneDisplay}
          </a>
          <span className="text-stone-500">ყოველდღე, 10:00 – 22:00</span>
        </div>
      </div>
      <div className="border-t border-white/[0.05]">
        <p className="mx-auto max-w-7xl px-4 py-6 text-xs text-stone-600 sm:px-6 lg:px-8">
          © {new Date().getFullYear()} mypoker.ge — ყველა უფლება დაცულია. აზარტული თამაში მხოლოდ 18 წლიდან.
        </p>
      </div>
    </footer>
  );
}

/* ------------------------------------------------------------------ */
/*  აპლიკაცია                                                          */
/* ------------------------------------------------------------------ */
function App() {
  const cart = useCart();
  const [cartOpen, setCartOpen] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (!toast) return undefined;
    const t = setTimeout(() => setToast(null), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  const cartApi = {
    ...cart,
    add: (id) => {
      cart.add(id);
      const product = PRODUCTS.find((p) => p.id === id);
      if (product && !cartOpen) setToast({ id: Date.now(), name: product.name });
    },
  };

  return (
    <div id="top" className="mp-sans min-h-screen bg-[#07080b] text-stone-200 antialiased selection:bg-amber-300/30 selection:text-white">
      <style>{GLOBAL_CSS}</style>
      <Header cartCount={cart.count} onOpenCart={() => {
          setToast(null);
          setCartOpen(true);
        }} />
      <main>
        <Hero />
        <Shop cart={cartApi} />
      </main>
      <Footer />
      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} cart={cartApi} />

      {toast && (
        <div
          key={toast.id}
          className="mp-toast fixed bottom-[calc(1.5rem+env(safe-area-inset-bottom,0px))] left-1/2 z-50 flex w-[calc(100%-2rem)] max-w-md items-center gap-3 rounded-2xl border border-white/10 bg-[#111318]/95 px-4 py-3 shadow-2xl backdrop-blur-xl"
          role="status"
        >
          <span className="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-amber-300/15 text-amber-200">
            <Check className="h-4 w-4" />
          </span>
          <p className="min-w-0 flex-1 truncate text-sm text-stone-200">
            კალათაში დაემატა: <span className="text-stone-50">{toast.name}</span>
          </p>
          <button
            type="button"
            onClick={() => {
              setToast(null);
              setCartOpen(true);
            }}
            className="shrink-0 text-sm font-semibold text-amber-200 hover:text-amber-100"
          >
            ნახვა
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
