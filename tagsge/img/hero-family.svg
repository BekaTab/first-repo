<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="t">
<title id="t">დამცავი ანტენები, ჩიპი, სტიკერი და მაგნიტი</title>
<defs>
  <radialGradient id="spot" cx="50%" cy="45%" r="50%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".45"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="stage" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="shadow"><stop offset="0" stop-color="#0B1220" stop-opacity=".26"/><stop offset=".6" stop-color="#0B1220" stop-opacity=".08"/><stop offset="1" stop-color="#0B1220" stop-opacity="0"/></radialGradient>
  <radialGradient id="field"><stop offset="0" stop-color="#1F5EFF" stop-opacity=".14"/><stop offset="1" stop-color="#1F5EFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="acr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".55" stop-color="#F1F5FD" stop-opacity=".82"/><stop offset="1" stop-color="#E2EAF8" stop-opacity=".92"/></linearGradient>
  <linearGradient id="led" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FA6FF"/><stop offset="1" stop-color="#1F5EFF"/></linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E333C"/><stop offset="1" stop-color="#121418"/></linearGradient>
  <radialGradient id="whiteTop" cx="38%" cy="28%" r="85%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#ECEFF4"/><stop offset="1" stop-color="#CDD3DD"/></radialGradient>
  <linearGradient id="whiteSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9C0CC"/><stop offset="1" stop-color="#7F8898"/></linearGradient>
  <radialGradient id="dome" cx="40%" cy="32%" r="75%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E4E8EE"/><stop offset="1" stop-color="#BFC6D1"/></radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7D8696"/><stop offset=".45" stop-color="#F6F8FB"/><stop offset=".7" stop-color="#B7BFCB"/><stop offset="1" stop-color="#6E7787"/></linearGradient>
  <linearGradient id="darkTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A515E"/><stop offset=".5" stop-color="#262B34"/><stop offset="1" stop-color="#14171D"/></linearGradient>
  <linearGradient id="darkSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E1014"/><stop offset=".35" stop-color="#2C323C"/><stop offset=".55" stop-color="#3A414D"/><stop offset="1" stop-color="#0E1014"/></linearGradient>
  <radialGradient id="cone" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#596273"/><stop offset="1" stop-color="#14171C"/></radialGradient>
  <filter id="glow" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  <g id="gate">
    <rect x="-66" y="-26" width="132" height="26" rx="9" fill="url(#base)"/>
    <rect x="-66" y="-26" width="132" height="2" rx="1" fill="#fff" opacity=".25"/>
    <rect x="-52" y="-446" width="104" height="420" rx="46" fill="url(#acr)" stroke="#C6D2E7" stroke-width="1.5"/>
    <rect x="-34" y="-414" width="68" height="346" rx="30" fill="none" stroke="#1F5EFF" stroke-width="10" opacity=".2" filter="url(#glow)"/>
    <rect x="-34" y="-414" width="68" height="346" rx="30" fill="none" stroke="url(#led)" stroke-width="3"/>
    <rect x="-20" y="-376" width="40" height="270" rx="18" fill="none" stroke="#9DB9FF" stroke-width="1.2" opacity=".55"/>
    <path d="M-44 -404 V-62" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-430" r="4" fill="#1F5EFF"/>
  </g>
  <style>
    .wave{fill:none;stroke:#1F5EFF;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:w 3.6s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
    .d2{animation-delay:1.2s}.d3{animation-delay:2.4s}
    @keyframes w{0%{transform:scale(.3,.6);opacity:0}15%{opacity:.4}100%{transform:scale(1,1);opacity:0}}
    @media (prefers-reduced-motion:reduce){.wave{animation:none;opacity:.16;transform:none}}
  </style>
