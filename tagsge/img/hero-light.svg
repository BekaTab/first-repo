<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t">
<title id="t">დამცავი ანტენები მაღაზიის შესასვლელთან</title>
<defs>
  <linearGradient id="acr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".55" stop-color="#F1F5FD" stop-opacity=".8"/><stop offset="1" stop-color="#E2EAF8" stop-opacity=".9"/></linearGradient>
  <linearGradient id="led" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FA6FF"/><stop offset="1" stop-color="#1F5EFF"/></linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E333C"/><stop offset="1" stop-color="#121418"/></linearGradient>
  <radialGradient id="shadow"><stop offset="0" stop-color="#0B1220" stop-opacity=".22"/><stop offset=".6" stop-color="#0B1220" stop-opacity=".07"/><stop offset="1" stop-color="#0B1220" stop-opacity="0"/></radialGradient>
  <radialGradient id="field"><stop offset="0" stop-color="#1F5EFF" stop-opacity=".16"/><stop offset="1" stop-color="#1F5EFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="dome" cx="40%" cy="32%" r="75%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E4E8EE"/><stop offset="1" stop-color="#BFC6D1"/></radialGradient>
  <filter id="glow" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  <g id="gate">
    <ellipse cx="0" cy="2" rx="96" ry="12" fill="url(#shadow)"/>
    <rect x="-66" y="-26" width="132" height="26" rx="9" fill="url(#base)"/>
    <rect x="-66" y="-26" width="132" height="2" rx="1" fill="#fff" opacity=".25"/>
    <rect x="-52" y="-446" width="104" height="420" rx="46" fill="url(#acr)" stroke="#C6D2E7" stroke-width="1.5"/>
    <rect x="-34" y="-414" width="68" height="346" rx="30" fill="none" stroke="#1F5EFF" stroke-width="10" opacity=".2" filter="url(#glow)"/>
    <rect x="-34" y="-414" width="68" height="346" rx="30" fill="none" stroke="url(#led)" stroke-width="3"/>
    <rect x="-20" y="-376" width="40" height="270" rx="18" fill="none" stroke="#9DB9FF" stroke-width="1.2" opacity=".55"/>
    <path d="M-44 -404 V-62" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-430" r="4" fill="#1F5EFF"/>
  </g>
  <style>
    .wave{fill:none;stroke:#1F5EFF;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:w 3.6s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
    .d2{animation-delay:1.2s}.d3{animation-delay:2.4s}
    @keyframes w{0%{transform:scale(.3,.6);opacity:0}15%{opacity:.45}100%{transform:scale(1,1);opacity:0}}
    @media (prefers-reduced-motion:reduce){.wave{animation:none;opacity:.18;transform:none}}
  </style>
</defs>
<ellipse cx="400" cy="340" rx="170" ry="250" fill="url(#field)"/>
<ellipse class="wave" cx="400" cy="340" rx="104" ry="220"/>
<ellipse class="wave d2" cx="400" cy="340" rx="104" ry="220"/>
<ellipse class="wave d3" cx="400" cy="340" rx="104" ry="220"/>
<use href="#gate" x="296" y="566"/>
<use href="#gate" x="504" y="566"/>
<g transform="translate(400 470)">
  <ellipse cx="0" cy="44" rx="46" ry="7" fill="url(#shadow)"/>
  <ellipse cx="0" cy="7" rx="38" ry="24" fill="#AEB6C3"/>
  <ellipse cx="0" cy="0" rx="38" ry="24" fill="#F4F6F9"/>
  <ellipse cx="0" cy="-2" rx="17" ry="11" fill="url(#dome)"/>
  <ellipse cx="0" cy="0" rx="21" ry="13.5" fill="none" stroke="#1F5EFF" stroke-opacity=".6" stroke-width="1.4"/>
  <ellipse cx="0" cy="-4" rx="4" ry="2.6" fill="#8C95A4"/>
</g>
</svg>
