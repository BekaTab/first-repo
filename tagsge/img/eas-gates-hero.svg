<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 120 1600 780" role="img" aria-labelledby="t">
<title id="t">დამცავი ანტენები მაღაზიის შესასვლელში — RF ანტენა და AM ანტენა</title>
<defs>
  <radialGradient id="spot" cx="50%" cy="38%" r="60%"><stop offset="0" stop-color="#3B6FE0" stop-opacity=".30"/><stop offset=".45" stop-color="#1D3C8F" stop-opacity=".12"/><stop offset="1" stop-color="#05070B" stop-opacity="0"/></radialGradient>
  <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4C86FF" stop-opacity=".42"/><stop offset=".5" stop-color="#2F6BFF" stop-opacity=".12"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="floorLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9DB9FF" stop-opacity="0"/><stop offset=".5" stop-color="#9DB9FF" stop-opacity=".55"/><stop offset="1" stop-color="#9DB9FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="acr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9DBFF" stop-opacity=".16"/><stop offset=".18" stop-color="#C9DBFF" stop-opacity=".05"/><stop offset=".8" stop-color="#C9DBFF" stop-opacity=".03"/><stop offset="1" stop-color="#C9DBFF" stop-opacity=".12"/></linearGradient>
  <linearGradient id="acrEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE8FF" stop-opacity=".75"/><stop offset=".6" stop-color="#9DB9FF" stop-opacity=".35"/><stop offset="1" stop-color="#9DB9FF" stop-opacity=".15"/></linearGradient>
  <linearGradient id="led" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B7D1FF"/><stop offset=".5" stop-color="#5B9BFF"/><stop offset="1" stop-color="#2F6BFF"/></linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C323D"/><stop offset="1" stop-color="#0B0D11"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="reflMask" maskUnits="userSpaceOnUse" x="0" y="760" width="1600" height="140"><rect x="0" y="760" width="1600" height="140" fill="url(#fade)"/></mask>
  <filter id="glow" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <g id="gate">
    <rect x="-74" y="-30" width="148" height="30" rx="9" fill="url(#base)"/>
    <rect x="-74" y="-30" width="148" height="2.5" rx="1.25" fill="#fff" opacity=".22"/>
    <rect x="-58" y="-560" width="116" height="530" rx="50" fill="url(#acr)" stroke="url(#acrEdge)" stroke-width="2"/>
    <rect x="-38" y="-520" width="76" height="440" rx="32" fill="none" stroke="#4C86FF" stroke-width="12" opacity=".55" filter="url(#glow)"/>
    <rect x="-38" y="-520" width="76" height="440" rx="32" fill="none" stroke="url(#led)" stroke-width="3"/>
    <rect x="-22" y="-470" width="44" height="340" rx="20" fill="none" stroke="#9DB9FF" stroke-width="1.2" opacity=".35"/>
    <path d="M-49 -510 V-60" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".35"/>
    <circle cx="0" cy="-540" r="4" fill="#9DC0FF"/>
    <circle cx="0" cy="-540" r="10" fill="#5B9BFF" opacity=".5" filter="url(#glow)"/>
  </g>
  <style>
    .wave{fill:none;stroke:#6FA2FF;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:w 3.6s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
    .d2{animation-delay:1.2s}.d3{animation-delay:2.4s}
    @keyframes w{0%{transform:scale(.25,.6);opacity:0}15%{opacity:.75}100%{transform:scale(1,1);opacity:0}}
    .pulse{animation:p 3.6s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.55}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.wave{animation:none;opacity:.35;transform:none}.pulse{animation:none}}
  </style>
</defs>
<ellipse cx="800" cy="420" rx="760" ry="430" fill="url(#spot)"/>
<ellipse cx="800" cy="760" rx="620" ry="70" fill="url(#floorGlow)"/>
<rect x="160" y="759" width="1280" height="1.5" fill="url(#floorLine)"/>
<g opacity=".35" stroke="#9DB9FF" stroke-opacity=".18">
  <path d="M800 760 L120 900 M800 760 L420 900 M800 760 L800 900 M800 760 L1180 900 M800 760 L1480 900"/>
  <path d="M260 800 H1340 M120 850 H1480" stroke-opacity=".12"/>
</g>
<g class="pulse">
  <ellipse cx="800" cy="470" rx="380" ry="260" fill="#2F6BFF" opacity=".10" filter="url(#soft)"/>
</g>
<g>
  <ellipse class="wave" cx="660" cy="470" rx="105" ry="230"/>
  <ellipse class="wave d2" cx="660" cy="470" rx="105" ry="230"/>
  <ellipse class="wave d3" cx="660" cy="470" rx="105" ry="230"/>
  <ellipse class="wave" cx="940" cy="470" rx="105" ry="230"/>
  <ellipse class="wave d2" cx="940" cy="470" rx="105" ry="230"/>
  <ellipse class="wave d3" cx="940" cy="470" rx="105" ry="230"/>
</g>
<g stroke="#6FA2FF" stroke-width="1.2" stroke-dasharray="2 10" opacity=".45">
  <path d="M590 380 H730 M590 470 H730 M590 560 H730 M870 380 H1010 M870 470 H1010 M870 560 H1010"/>
</g>
<use href="#gate" x="520" y="760"/>
<use href="#gate" x="800" y="760"/>
<use href="#gate" x="1080" y="760"/>
<g mask="url(#reflMask)" opacity=".5">
  <g transform="translate(0 1520) scale(1 -1)">
    <use href="#gate" x="520" y="760"/>
    <use href="#gate" x="800" y="760"/>
    <use href="#gate" x="1080" y="760"/>
  </g>
</g>
</svg>
