name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply content edited in /admin
        run: node tools/apply-content.mjs .
      # LuxePet store: build it and publish the built page in place of its sources (served at /luxepet/)
      - name: Build LuxePet store
        run: |
          npm ci --prefix luxepet --no-audit --no-fund
          npm run build --prefix luxepet
          mv luxepet/dist "$RUNNER_TEMP/luxepet"
          rm -rf luxepet
          mv "$RUNNER_TEMP/luxepet" luxepet
          rm luxepet/standalone.html
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # Oceans Lines (Next.js): export it as static files and publish them in place of its sources (served at /oceanslines/)
      - name: Build Oceans Lines
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/oceanslines
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --prefix oceanslines --no-audit --no-fund
          npm run build --prefix oceanslines
          mv oceanslines/out "$RUNNER_TEMP/oceanslines"
          rm -rf oceanslines
          mv "$RUNNER_TEMP/oceanslines" oceanslines
          # Next 14 export fetches the home page's navigation data from <base>.txt (one level up)
          cp oceanslines/index.txt oceanslines.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
